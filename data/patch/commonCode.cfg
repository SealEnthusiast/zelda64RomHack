#-----------------------------------------------------------
# sOcarinaSongNotes BA8120 - BA89E0
# Ocarina Playback in Start menu
# Songs are 20 Bytes Long each and end on FF000000 xx000000 where xx is the previous volume
# Repeat Notes require a note break as follows- FF000003 52000000
# xx0000yyzz00aabb where 
# xx = Note  (02 - A Button, 05- C-Down, 09-C-Right , 0B-C-Left, 0E- C-Up , FF- OCARINA_PITCH_NONE)
# yy = Note Length
# zz = Note Volume
# aa= Pitch (signed)
# bb= Vibrato (signed)
#-----------------------------------------------------------
# Other Pitches:
#    		/* 0x0 */ OCARINA_PITCH_C4,
#    		/* 0x1 */ OCARINA_PITCH_DFLAT4,
#    /* 0x2 */ OCARINA_PITCH_D4,
#    		/* 0x3 */ OCARINA_PITCH_EFLAT4,
#    		/* 0x4 */ OCARINA_PITCH_E4,
#    /* 0x5 */ OCARINA_PITCH_F4,
#    		/* 0x6 */ OCARINA_PITCH_GFLAT4,
#    		/* 0x7 */ OCARINA_PITCH_G4,
#    		/* 0x8 */ OCARINA_PITCH_AFLAT4,
#    /* 0x9 */ OCARINA_PITCH_A4,
#    		/* 0xA */ OCARINA_PITCH_BFLAT4,
#    /* 0xB */ OCARINA_PITCH_B4,
#    		/* 0xC */ OCARINA_PITCH_C5,
#    		/* 0xD */ OCARINA_PITCH_DFLAT5,
#    /* 0xE */ OCARINA_PITCH_D5,
#    		/* 0xF */ OCARINA_PITCH_EFLAT5,
#    /* 0xFF */ OCARINA_PITCH_NONE = 0xFF
